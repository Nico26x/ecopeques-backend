spring.config.import=optional:file:.env[.properties]

spring.application.name=ecopeques-backend
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ecopeques_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Seguridad JWT
jwt.secret=${JWT_SECRET:EcoPequesSecretKeyUltraSeguraParaDesarrolloLocal1234567890!}
ecopeques.jwt.secret=${jwt.secret}
ecopeques.jwt.expiration-ms=${ECOPEQUES_JWT_EXPIRATION_MS:86400000}
