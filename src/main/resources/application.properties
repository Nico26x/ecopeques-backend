spring.config.import=optional:file:.env[.properties]

spring.application.name=ecopeques-backend
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mariadb://${ECOPEQUES_DB_HOST:localhost}:${ECOPEQUES_DB_PORT:3307}/${ECOPEQUES_DB_NAME:ecopeques_db}}
spring.datasource.username=${DB_USERNAME:${ECOPEQUES_DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${ECOPEQUES_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Seguridad JWT
jwt.secret=${JWT_SECRET:${ECOPEQUES_JWT_SECRET:EcoPequesSecretKeyUltraSeguraParaDesarrolloLocal1234567890!}}
ecopeques.jwt.secret=${jwt.secret}
ecopeques.jwt.expiration-ms=${ECOPEQUES_JWT_EXPIRATION_MS:86400000}
