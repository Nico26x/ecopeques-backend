spring.config.import=optional:file:.env[.properties]

spring.application.name=ecopeques-backend
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=jdbc:mariadb://${ECOPEQUES_DB_HOST:localhost}:${ECOPEQUES_DB_PORT:3306}/${ECOPEQUES_DB_NAME:ecopeques_db}
spring.datasource.username=${ECOPEQUES_DB_USER:root}
spring.datasource.password=${ECOPEQUES_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Seguridad JWT
ecopeques.jwt.secret=${ECOPEQUES_JWT_SECRET:EcoPequesSecretKeyParaFirmarTokensJWT256BitsMinimo123456}
ecopeques.jwt.expiration-ms=${ECOPEQUES_JWT_EXPIRATION_MS:86400000}
